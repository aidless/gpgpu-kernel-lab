[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gkern"
version = "0.1.0"
description = "A CPU-runnable lab for GPGPU kernel, compiler and PyTorch-adapter skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "torch>=2.4", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
cpp = ["pybind11>=2.10"]
all = ["pytest>=7.4", "pybind11>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
