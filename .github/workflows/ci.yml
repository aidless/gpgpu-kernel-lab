name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install package
        run: pip install -e ".[dev]"
      # build isolation 里没有 pybind11，setup.py 会静默跳过扩展；必须 --no-build-isolation。
      # 跳过时少掉的用例数由清单闸核对：cpp_pytest_items=22
      - name: Build the optional C++ extension
        run: |
          pip install pybind11
          pip install -e ".[cpp]" --no-build-isolation
      - name: Verify the C++ extension actually got built and matches numpy
        run: python scripts/verify_cpp.py
        env:
          PYTHONPATH: src
      - name: Run tests
        run: pytest -q
      - name: Run quickstart example
        run: python examples/quickstart.py
        env:
          PYTHONPATH: src
      - name: Verify every documented number is recomputable
        run: python scripts/verify_numbers.py
        env:
          PYTHONPATH: src
      - name: Prove the number gate can actually fail
        run: python scripts/verify_numbers.py --selftest
        env:
          PYTHONPATH: src
      - name: Run benchmarks (smoke, writes results/)
        run: python benchmarks/run_benchmarks.py
        env:
          PYTHONPATH: src
      - name: Re-derive the cloud reconciliation from committed evidence
        run: python benchmarks/analyze_triton.py
        env:
          PYTHONPATH: src
      - name: Assert smem bytes, warp-level bank conflicts, and bf16 precision accounting
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("benchmarks/results/bench.json").read_text())
          assert all(r["bytes_equal"] for r in data["smem"]), data["smem"]
          assert all(r["close"] for r in data["smem"]), data["smem"]
          bank = {r["pitch"]: r["conflicts"] for r in data["bank"]}
          assert bank[32] == 992 and bank[33] == 0, bank
          reuse = {r["n"]: r["reuse_bound"] for r in data["reuse"]}
          assert reuse[2048] == "compute", reuse
          # 混合精度：两条累加路径的访存必须完全相等，而 bf16 的误差必须明显更大
          prec = {(r["shape"], r["accumulate"]): r for r in data["precision"]}
          for shape in ("256x512", "512x1024"):
              a, b = prec[(shape, "fp32")], prec[(shape, "bf16")]
              assert a["bytes"] == b["bytes"], (a, b)
              assert float(b["max_error"]) > 100 * float(a["max_error"]), (a, b)
          print("smem 字节相等 / bank 992-0 / 复用上界 n=2048 compute / bf16 误差与字节 均通过")
          PY
      - name: Assert the scheduling accounting (waves, stream-K partition, recommendations)
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("benchmarks/results/bench.json").read_text())
          rows = data["schedule"]
          by = {(r["shape"], r["strategy"]): r for r in rows}
          tail = "1280x1280x528 (tail)"
          deep = "256x256x8192 (deep-K)"
          # persistent 治不了 tail：与 naive 的利用率必须完全相同
          assert by[(tail, "persistent")]["efficiency"] == by[(tail, "naive")]["efficiency"], rows
          assert by[(deep, "persistent")]["efficiency"] == by[(deep, "naive")]["efficiency"], rows
          # 深 K 小输出的 naive 只有 4 个单元铺 40 个槽
          assert by[(deep, "naive")]["efficiency"] == 0.1, by[(deep, "naive")]
          # 结论随形状翻转
          verdict = {v["shape"]: v["best"] for v in data["schedule_verdict"]}
          assert verdict[tail] == "split-k" and verdict[deep] == "stream-k", verdict
          # 部分和份数必须来自真实划分，且不可能超过 worker 边界数
          for row in rows:
              if row["strategy"] == "stream-k":
                  assert 0 <= row["partial_cuts"] <= 39, row
          print("调度账通过：persistent==naive / naive(deep)=0.1 / 推荐 split-k 与 stream-k / 部分和 <= 39")
          PY
      - name: Assert the fusion byte equality still holds
        run: |
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path("benchmarks/results/bench.json").read_text())["fusion"]
          ok = [r for r in rows if r["match"]]
          assert len(ok) >= 3, rows
          assert all(r["outputs_close"] for r in rows), rows
          print("fusion等式与数值一致性均通过：", len(ok), "行 match=True")
          PY
